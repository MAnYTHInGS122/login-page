<body>
    <div class="container">
        <span class="animate"></span>
        <span class="animate2"></span>
        <div class="formbox login">
        <form action="#">
            <h2 class="animation" style="--i:0;">Login</h2>
            <div class="input-box animation" style="--i:1;
            ">
               
                <input type="text" required>
                <label for="">username</label>
                 <i class="fa-solid fa-user"></i>
                
            </div>
            <div class="input-box animation" style="--i:2;">

                      <i class="fa-solid fa-lock"></i>
                
            </div>
            <button class="animation" style="--i:3;">Login</button>
            <div class="reg-link animation" style="--i:4;">
                <p>dont have an account? <a href="#" class="loginlink">sign up</a></p>
            </div>
            

        </form>
        
    </div>
    
         <div class="formbox Register">

            <button class="animation" style="--i:12">Login</button>
